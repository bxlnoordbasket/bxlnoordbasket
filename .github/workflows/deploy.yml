name: Deploy BNB website

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build
        env:
          VITE_FORMSPREE_ENDPOINT: ${{ secrets.VITE_FORMSPREE_ENDPOINT }}

      - name: Create static route pages
        run: |
          mkdir -p dist/praktisch
          mkdir -p dist/over-bnb
          mkdir -p dist/contact
          mkdir -p dist/privacy
          mkdir -p dist/steun-stad-brussel

          cp dist/index.html dist/praktisch/index.html
          cp dist/index.html dist/over-bnb/index.html
          cp dist/index.html dist/contact/index.html
          cp dist/index.html dist/privacy/index.html
          cp dist/index.html dist/steun-stad-brussel/index.html

          cp dist/index.html dist/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4